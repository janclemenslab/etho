# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'paper/**'
      - 'docs/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/static.yml'
      - '*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'paper/**'
      - 'docs/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/static.yml'
      - '*'
jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install flake8 pytest --system
        uv pip install ".[dev,docs]" --upgrade --system
    - name: Create etho config
      run: |
        New-Item -ItemType Directory -Force "$HOME/ethoconfig" | Out-Null
        @'
        user: ncb
        host: localhost
        savefolder: data
        protocolfolder: ethoconfig/protocols
        playlistfolder: ethoconfig/playlists
        stimfolder: ethoconfig/stim
        python_exe: python
        ATTENUATION:
          -1: 1
          0: 1
          100: 1
          150: 1
          200: 1
          250: 1
          300: 1
          350: 1
          400: 1
          450: 1
          500: 1
          600: 1
          700: 1
          800: 1
          900: 1
          1000: 1
          1500: 1
          2000: 1
        '@ | Set-Content "$HOME/ethoconfig/ethoconfig.yml"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
