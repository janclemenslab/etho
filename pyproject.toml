[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "etho-python"
authors = [
       {name = "Jan Clemens", email = "clemensjan@googlemail.com"},
]
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["description"]
requires-python = ">=3.10"
dependencies = [
                'numpy', 'scipy', 'h5py', 'opencv-python-headless', 'bleak',
                'pandas', 'pyzmq', 'gevent', 'future', 'pillow', 'msgpack-python',
                'pyyaml', 'ipython', 'defopt', 'msgpack-numpy', 'rich', 'psutil', 'tables',
                'pydaqmx', 'pyqtgraph', 'qtpy', 'PySide6-Essentials', 'zarr', 'zerorpc-numpy'
                ]
readme= "README.md"
version="1.1"

[project.scripts]
etho = "etho.cli:main"

[project.optional-dependencies]
dev = ["pytest", "flit>=3.2,<4"]
doc = [
       "sphinx", "furo", "shibuya", "sphinx-copybutton", "ghp-import",
       "myst-nb", "sphinx-panels", "sphinxcontrib-images",
       "sphinx-tabs", "sphinx-iconify", "sphinx-design",
       ]

[project.urls]
source = "https://github.com/janclemenslab/etho"
documentation = "https://janclemenslab.org/etho/"

[tool.flit.module]
name = "etho"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests",]

[tool.ruff]
line-length = 196
